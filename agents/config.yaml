system:
  redis_url: "redis://localhost:6379/0"
  # The repository the agents WORK ON. Left at "." the orchestrator analyses itself,
  # which is the dogfood mode and not what this is for. The orchestrator is still run
  # from its own directory - system_prompt and log_dir below stay relative to that.
  working_dir: "C:/Users/hijbe/Documents/Projects/Atlas"
  log_dir: "agents/logs"
  # Prepended to the PM's startup trigger. The PM analyses the codebase on its own
  # initiative, so without this it discovers what the project is every single run.
  analysis_context: >
    Atlas is an Angular 22 and Ionic 9 progressive web application for exploring Magic:
    The Gathering cards through structured filters, with a Node ETL that generates the
    card collection. It has not launched publicly yet.
    Read CLAUDE.md and docs/HANDOFF.md before proposing anything: the project keeps a
    register of defects in docs/register/ and a backlog in docs/backlog/, and most
    things worth doing are already written down there with reasoning attached.
    Prefer proposals that are small, verifiable, and behaviour-preserving. Changes to
    generated data, dependencies, the deploy path or the service worker need explicit
    human approval and should not be proposed as routine work.
  max_concurrent_tasks: 2
  once_timeout: 1800
  max_restarts: 3
  idle_timeout: 60
  max_change_rounds: 3
  cascade_poll_interval: 2
  restart_delay: 5
  # ONE WEEK. The shipped value was 300 - five minutes - which is a machine's idea of a
  # timeout rather than a person's; it then spent time at 24 hours, which is still an
  # assumption that the operator looks at this every day.
  #
  # A gate is a question put to a person, and the honest bound is how long that person
  # might reasonably be away: a weekend, a trip, a week of doing something else. Expiry
  # REFUSES the action rather than allowing it, so a long timeout costs nothing but a
  # thread sitting still, while a short one silently converts "not asked yet" into "no".
  # Nothing is lost by waiting, and a refusal can now be revisited anyway.
  gate_timeout: 604800
  max_pending_proposals: 3  # PM pauses when this many proposals await technical review
  max_pending_tasks: 3      # Architect holds approvals when this many tasks await developer
  max_pending_reviews: 5    # Slows upstream (PM triggers + architect tasks) when reviews back up

  # Your plan's weekly token allowance, from the Claude Code plan page. Nothing in the
  # CLI exposes it, so it has to be set here. 0 shows the raw counts without a
  # percentage - which is honest, but "6% of this week" is the number worth acting on
  # where "$1.21" is not, on a subscription.
  weekly_token_budget: 0
  # Which tokens count toward it: output, input, or both. "both" is the conservative
  # reading; change it if the plan counts only one.
  weekly_token_basis: both

  # A fresh `git worktree add` has the tracked files and nothing else. Everything below is
  # gitignored in the target project and needed anyway, so without it a developer agent
  # can edit and typecheck but cannot build - and work that cannot be verified is worse
  # than no work. Paths are relative to working_dir. Adjust these per project; the
  # mechanism is generic, the paths are not.
  worktree_setup:
    copy_paths:
      # NOTHING. The developer works on application code and does not get the data.
      #
      # The generated collection is ~292 MB and the vendor input ~629 MB. Between them
      # they made every worktree about 921 MB of material the developer never needs to
      # read and can only be harmed by reading - and both sat inside the reach of an
      # agent holding Read, Glob and Grep.
      #
      # THE COST IS REAL AND IS ACCEPTED: without the generated collection a full
      # `ng build` cannot complete, because angular.json's asset globs name that
      # directory. Typecheck, lint and unit tests still run. Data work - and the data
      # that work needs - belongs to a role whose job is data, not to every developer.
      #
      # Card images were never copied: ~467,000 files and 22 GB.
      []
    commands:
      # Measured at 14 s against a warm npm cache. Cheaper than sharing node_modules,
      # where one agent's `npm install` would mutate every other agent's tree.
      - npm ci --no-audit --no-fund
    command_timeout: 900
    # No version_file, because nothing is copied any more. It existed to catch a
    # regeneration in the main checkout making a worktree's COPY silently wrong; with no
    # copy there is nothing to go stale, and leaving it set would mark every worktree
    # stale forever and re-run npm ci on every reuse. It comes back with the role that
    # gets the data.
    version_file: null

agents:
  # Opus at high effort, and this is a change of mind with a reason. The PM was read as a
  # codebase quality scanner, which sonnet does well enough. It is better understood as
  # the role that supplies PRODUCT THINKING the user does not have time to do themselves -
  # in AUTOMATIC mode it decides what is worth building at all, and everything downstream
  # inherits that judgement. A cheap model here does not save money, it spends the
  # architect's and the developer's on work that was not worth proposing.
  #
  # In MANUAL mode this agent stands down entirely and costs nothing, so the expensive
  # model is only paid for when it is actually being asked to think.
  pm:
    count: 1
    cli: claude
    model: opus
    reasoning_effort: high
    permission_mode: plan
    system_prompt: agents/prompts/pm.md
    subscribes_to: [system, reviews]
    publishes_to: [proposals, cli-traces]
    schedule:
      trigger: startup
    # Deliberation disabled: codex is not installed and there is no subscription.
    # deliberation:
    #   cli: codex
    #   model: gpt-5.4
    #   reasoning_effort: medium
    #   rounds: 2

  product_designer:
    count: 1
    cli: claude
    model: sonnet
    permission_mode: plan
    system_prompt: agents/prompts/product_designer.md
    subscribes_to: [proposals]
    publishes_to: [design-feedback, cli-traces]

  # The architect carries the full context and forwards each role only what that role
  # needs to execute faithfully towards expectation. It is the ONLY role that needs
  # breadth, which is what earns it the expensive model - and everyone downstream is
  # cheap BECAUSE it was expensive. A task_assignment is a context package, not an
  # instruction: name the files, the constraints and what "done" means, and the developer
  # arrives oriented rather than rediscovering it with a model chosen for writing code.
  architect:
    count: 1
    cli: claude
    model: opus
    reasoning_effort: high
    permission_mode: plan
    system_prompt: agents/prompts/architect.md
    subscribes_to: [proposals, design-feedback]
    publishes_to: [reviews, tasks, cli-traces]
    # Deliberation disabled: codex is not installed and there is no subscription.
    # deliberation:
    #   cli: codex
    #   model: gpt-5.4
    #   reasoning_effort: medium
    #   rounds: 2

  # Sonnet at high effort, not opus. The upstream default spends the most expensive model
  # here; this executes against a context package it did not have to derive. High effort
  # because a defect that looks mechanical is usually causal underneath.
  developer:
    count: 1          # one worktree: reduce batch size before attacking bottlenecks
    cli: claude
    model: sonnet
    reasoning_effort: high
    permission_mode: acceptEdits
    system_prompt: agents/prompts/developer.md
    # Node and Angular, not Python: the upstream default grants Bash(python:*) and
    # Bash(pytest:*), which this project has no use for and which would leave the agent
    # unable to run its own build, tests or lint.
    allowed_tools: "Edit Read Glob Grep Bash(git:*) Bash(npm:*) Bash(npx:*) Bash(node:*)"
    subscribes_to: [tasks, review-results]
    publishes_to: [review-requests, progress, cli-traces]
    use_consumer_group: true

  # KNOWN LIMITATION, recorded rather than glossed: upstream puts the reviewer on codex
  # deliberately, so a model does not review its own family's output. codex is not
  # installed here and there is no subscription, so it runs on claude and that bias
  # protection is lost. High effort because this project's expensive failures were
  # invisible in the diff - a rule that was correct but produced the wrong output, a
  # verification shaped so it could not fail, a number taken from a single run.
  reviewer:
    count: 1
    cli: claude
    model: sonnet
    reasoning_effort: high
    permission_mode: plan
    # Replaces codex's `sandbox: read-only`. A reviewer that can edit is a defect, so the
    # inability is made explicit here rather than left to permission_mode alone.
    allowed_tools: "Read Glob Grep Bash(git diff:*) Bash(git log:*) Bash(git show:*)"
    system_prompt: agents/prompts/reviewer.md
    subscribes_to: [review-requests]
    publishes_to: [review-results, cli-traces]

safety:
  blocked_patterns:
    - "rm -rf"
    - "git push --force"
    - "git reset --hard"
    - "DROP TABLE"
    - "DELETE FROM"
    # NOTHING PROJECT-SPECIFIC HERE, and the reason is worth keeping.
    #
    # blocked_patterns is checked by safety.check_prompt() against the TEXT OF THE
    # PROMPT, not against commands an agent runs. Adding "npm install",
    # "production-update" and similar looked like "do not let agents do these things";
    # what it actually did was refuse any message whose text MENTIONED them.
    #
    # It fired immediately. The PM proposed something that discussed dependencies, and
    # the architect could not review the proposal at all:
    #
    #   SafetyViolation: Prompt contains 'npm install'
    #
    # 1.7M tokens and $2.56 spent by the architect, three proposals consumed, nothing
    # produced. A rule meant to prevent an action prevented a conversation.
    #
    # Execution is controlled where execution happens: allowed_tools per agent, and
    # human_approval_required below. The patterns that remain are the ones where the
    # text appearing in a prompt is itself the warning sign.
  protected_files:
    - ".env"
    - "vercel.json"
    - "agents/config.yaml"
    # The rules the agents work under. An agent that can edit its own constraints does
    # not have constraints, so these are protected before anything else.
    - "CLAUDE.md"
    - ".claude/rules/"
    - ".claude/settings.json"
    # Dependencies and build configuration: changing these is gated on a human in this
    # project, and B63 is an open entry about a second lockfile already causing trouble.
    - "package.json"
    - "package-lock.json"
    - "yarn.lock"
    - "angular.json"
    # The deploy and boot path. R149 took production down twice in one day from the
    # first of these; R140 and R151 live in the second.
    - "deploy/"
    - "scripts/postbuild-index.js"
    - "ngsw-config.json"
    # Generated data and the ETL that produces it. Editing generated JSON directly is
    # forbidden by the project's own rules, and a regeneration is a gated operation.
    - "src/assets/mtg/data/"
    - "scripts/mtg/transform-card-collection.js"
    - "scripts/mtg/vendor-refresh.js"
  branch_prefix: "agent/"
  never_push_to: ["main", "master"]
  # Actions that require human approval via `agent-orchestrator approve`.
  # If the approval console is not running, gated actions will time out
  # and be blocked after gate_timeout seconds.
  # Remove items from this list to run fully autonomously.
  human_approval_required:
    # THE EXPENSIVE DECISION IS "START THIS", NOT "SHIP THIS".
    #
    # With only create_pr gated, a task ran the whole cycle - developer works a worktree,
    # reviewer reads the diff - and the first human decision came after all of it was
    # paid for. If the premise was wrong, the tokens were already gone. The architect
    # rejects proposals on their premise often enough that this is a real cost, not a
    # hypothetical one.
    #
    # assign_task blocks at the point where refusing is still free.
    - assign_task            # Nothing is built until a human says so
    - delete_files
    - modify_database
    - create_pr              # Human reviews before PR is created
    # - push_to_remote       # Uncomment to gate branch pushes
    # - large_change         # Uncomment to gate changes exceeding max_files_per_change
  max_files_per_change: 10
